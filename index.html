<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <title>Chrome Yuklab Olish</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 30px; }
        .download-btn {
            display: inline-block;
            background-color: #4285F4; /* Google ko'k rangi */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .download-btn:hover { background-color: #3367D6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chrome</h1>


            <h3>Matnni nusxalash namunasi:</h3>
    <div class="copy-container">
        <!-- Nusxalanishi kerak bo'lgan matn maydoni -->
        <input type="text" id="myInput" value="https://www.apkmirror.com/apk/google-inc/chrome/chrome-77-0-3865-73-release/google-chrome-fast-secure-77-0-3865-73-android-apk-download/download/?key=2b5052e2e72ccd2d3fbc5e93f7c33be79bc33d81">
        
        <!-- Nusxalash tugmasi -->
        <button onclick="copyText()">Nusxalash</button>
    </div>



        
    <button>
        <a href"https://www.apkmirror.com/apk/google-inc/chrome/chrome-77-0-3865-73-release/google-chrome-fast-secure-77-0-3865-73-android-apk-download/download/?key=2b5052e2e72ccd2d3fbc5e93f7c33be79bc33d81" class="download-btn" >Sayt</a>
    </button>
        <p>Televizoringiz uchun Chrome faylini yuklab oling.</p>
        <!-- BU YERGA O'ZGARTIRISH KIRITING -->
        <a href="chrome.xapk" class="download-btn" download>Yuklab Olish</a>
    </div>

        <script>
        function copyText() {
            // 1. Input elementini tanlab olamiz
            var copyText = document.getElementById("myInput");

            // 2. Matnni kompyuter/telefon xotirasiga (clipboard) yozamiz
            navigator.clipboard.writeText(copyText.value).then(function() {
                // 3. Foydalanuvchiga nusxalangani haqida xabar beramiz
                alert("Matn nusxalandi: " + copyText.value);
            }).catch(function(err) {
                console.error("Xatolik yuz berdi: ", err);
            });
        }
    </script>
</body>
</html>
